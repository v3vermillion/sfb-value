      <symbol id="i-wifi-off" viewBox="0 0 24 24"><path d="M2 8.5A16 16 0 0 1 12 5c1.4 0 2.7.2 4 .5M22 8.5a16 16 0 0 0-3-1.8M5 12.5a11 11 0 0 1 7-2.5M19 12.5a11 11 0 0 0-2.5-1.6M8.5 16.5a6 6 0 0 1 7 0M3 3l18 18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="12" cy="19.5" r="1.2" fill="currentColor"/></symbol>
    </defs>
  </svg>

  <header class="top" id="top">
    <a class="brand" href="./" aria-label="SFB Value home">
      <img class="mark" src="./icons/icon-192.png" alt="" width="28" height="28" decoding="async" draggable="false">
      <span class="wordmark">SFB <b>Value</b></span>
    </a>
    <button class="status" id="status" type="button" aria-label="Price list: Loading. Opens Settings.">
      <span class="dot" aria-hidden="true"></span>
      <span class="status-text" id="statusText" aria-hidden="true"><span class="st-long">Loading</span><span class="st-short">Loading</span></span>
    </button>
    <button class="tally-pill" id="tallyBtn" type="button" hidden>
      <svg class="ico" aria-hidden="true"><use href="#i-receipt"/></svg>
      <span class="sr-only">Donation tally, </span><span class="sr-only" id="tallyCount">0 items</span>
      <b id="tallyTotal">$0.00</b>
    </button>
    <button class="icon-btn" id="settingsBtn" type="button" aria-label="Settings"><svg class="ico" aria-hidden="true"><use href="#i-gear"/></svg></button>
  </header>
  <span class="sr-only" id="statusLive" aria-live="polite"></span>
  <span class="sr-only" id="resultsLive" aria-live="polite"></span>

  <div class="progress" id="progress" hidden aria-hidden="true"><div class="bar" id="progressBar"></div></div>
  <div class="stale" id="stale" hidden></div>

  <div class="dock" id="dock">
    <form class="search" id="searchForm" role="search" autocomplete="off">
      <svg class="ico search-ico" aria-hidden="true"><use href="#i-search"/></svg>
      <input id="q" class="q" type="search" name="q" inputmode="search" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="search" placeholder="Item, size or barcode" aria-label="Search by item and size, or barcode number">
      <button class="clear-btn" id="clearBtn" type="button" aria-label="Clear search" hidden><svg class="ico" aria-hidden="true"><use href="#i-x"/></svg></button>
    </form>
    <button class="scan-btn" id="scanBtn" type="button" aria-label="Scan a barcode with the camera">
      <svg class="ico" aria-hidden="true"><use href="#i-scan"/></svg>
      <span>Scan</span>
    </button>
  </div>

  <main id="main" class="main">
    <h1 class="sr-only" id="pageTitle" tabindex="-1">SFB Value, Strongsville Emergency Food Bank</h1>
    <section id="home" class="home">
      <p class="org" id="heroEyebrow"><span class="org-name">Strongsville Emergency Food Bank</span><span class="org-ref">1 John 4:19</span></p>
      <button class="status-card" id="readyCard" type="button" hidden></button>
      <button class="tally-card" id="tallyCard" type="button" data-empty="true">
        <span class="tc-ico" aria-hidden="true"><svg class="ico"><use href="#i-receipt"/></svg></span>
        <span class="tc-text"><span class="tc-label">Donation tally</span><span class="tc-total counting" id="tallyCardTotal">$0.00</span><span class="tc-sub" id="tallyCardSub">No items added</span></span>
        <svg class="ico chev" aria-hidden="true"><use href="#i-back"/></svg>
      </button>
      <div class="install" id="installHint" hidden></div>
      <section class="recent" id="recent" hidden aria-labelledby="recentH">
        <div class="recent-head"><h2 class="h2" id="recentH">Recent</h2><button class="link-btn" type="button" id="recentClear" aria-label="Clear Recent">Clear</button></div>
        <ol class="list list--compact recent-list" id="recentList"></ol>
      </section>
      <div class="home-empty" id="homeEmpty">
        <span class="he-ico" aria-hidden="true"><svg class="ico"><use href="#i-scan"/></svg></span>
        <h2 class="he-title">Scan a barcode to begin</h2>
        <p class="he-sub">Or search by product name and size.</p>
      </div>
    </section>

  </main>
  <section id="results" class="results" hidden>
    <ol class="list" id="list" aria-label="Search results"></ol>
  </section>
  <div class="results-meta" id="resultsMeta" hidden></div>


  <dialog id="sheet" class="sheet" aria-labelledby="sheetTitle"></dialog>
  <dialog id="tallySheet" class="sheet" aria-labelledby="tallyTitle"></dialog>
  <dialog id="settings" class="panel" aria-labelledby="settingsTitle"></dialog>

  <div id="tour" class="tour" hidden>
    <div class="tour-spot" id="tourSpot" hidden></div>
    <section class="tour-card" id="tourCard" role="dialog" aria-modal="true" aria-labelledby="tourTitle" aria-describedby="tourStep tourText" tabindex="-1"></section>
  </div>
  <div id="scanner" class="scanner" hidden role="dialog" aria-modal="true" aria-label="Barcode scanner">
    <video id="video" class="video" playsinline muted autoplay aria-hidden="true"></video>
    <canvas id="overlay" class="overlay" aria-hidden="true"></canvas>
    <div class="scan-top">
      <button class="scan-ctl" id="scanClose" type="button" aria-label="Close scanner"><svg class="ico" aria-hidden="true"><use href="#i-x"/></svg></button>
      <button class="scan-ctl" id="torchBtn" type="button" aria-pressed="false" aria-label="Flashlight" hidden><svg class="ico" aria-hidden="true"><use href="#i-torch"/></svg></button>
    </div>
    <div class="reticle" id="reticle" aria-hidden="true"><i></i><i></i><i></i><i></i><span class="laser"></span></div>
    <div class="scan-bottom">
      <p class="scan-hint" id="scanHint" role="status">Center the barcode in the frame</p>
      <form class="scan-type" id="scanTypeForm" hidden>
        <input id="scanTypeInput" class="q" type="text" inputmode="numeric" pattern="[0-9 ]*" autocomplete="off" placeholder="Barcode number" aria-label="Barcode number">
        <button type="submit" class="btn btn--accent">Look up</button>
      </form>
      <button class="btn btn--ghost" id="scanTypeBtn" type="button"><svg class="ico" aria-hidden="true"><use href="#i-keypad"/></svg> Enter the barcode manually</button>
    </div>
  </div>

  <div id="toasts" class="toasts" aria-live="polite" aria-atomic="false"></div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
